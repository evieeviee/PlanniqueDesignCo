<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | Plannique Design Co</title>
  <meta name="description" content="The page you requested could not be found. Return to Plannique Design Co to explore website packages and portfolio collections.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f1ede6">

  <link rel="canonical" href="https://planniquedesignco.com/404.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #f1ede6;
      --white: #ffffff;
      --ink: #2a2723;
      --muted: #756e66;
      --sage: #75816f;
      --sage-dark: #596352;
      --line: #ddd2c5;
      --green: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "DM Sans", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(117, 129, 111, .15), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(176, 138, 108, .13), transparent 25%),
        var(--paper);
    }

    .card {
      width: min(720px, 100%);
      padding: clamp(32px, 7vw, 68px);
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 28px 80px rgba(56, 45, 34, .14);
    }

    .code {
      color: var(--sage-dark);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin-top: 14px;
      font-family: "Playfair Display", serif;
      font-size: clamp(54px, 12vw, 96px);
      line-height: .95;
    }

    h2 {
      margin-top: 20px;
      font-family: "Playfair Display", serif;
      font-size: clamp(28px, 5vw, 42px);
    }

    p {
      max-width: 540px;
      margin: 16px auto 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 800;
      transition: transform .2s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      color: var(--white);
      background: var(--ink);
    }

    .btn-whatsapp {
      color: var(--white);
      background: var(--green);
    }

    @media (max-width: 520px) {
      .actions {
        display: grid;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="code">Error 404</div>

    <h1>404</h1>

    <h2>This page could not be found.</h2>

    <p>
      The page may have moved or the address may be incorrect.
      Return to Plannique Design Co or contact us for help choosing a website package.
    </p>

    <div class="actions">
      <a class="btn btn-primary" href="/">Return to Home</a>

      <a
        class="btn btn-whatsapp"
        href="https://wa.me/60168083598?text=Hi%2C%20I%20need%20help%20with%20the%20Plannique%20website."
        target="_blank"
        rel="noopener"
      >
        WhatsApp Us
      </a>
    </div>
  </main>
</body>
</html>
